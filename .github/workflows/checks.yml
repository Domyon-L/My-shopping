name: Catalog and interaction checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Ensure published data matches its sources
        run: git diff --exit-code -- dist/index.html dist/catalog-data.js catalog/reviewed-catalog.json catalog/verified-batch.json catalog/audit-report.json
